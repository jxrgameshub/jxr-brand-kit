<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-label="JXR Gaming follow alert overlay">
  <title>Alert — 720 x 200 (BRAND-GUIDELINES.md §8.5 D)</title>
  <desc>
    Follow / sub / raid alert. Place at x=40, y=160. Replace [TITLE], [USERNAME], [CODE].
    The code strip at the bottom is mandatory — an alert is a peak-attention moment.
    Animation: 400ms slide from -24px, hold 6s, 400ms fade out.
    Sound: none by default.
  </desc>

  <defs>
    <clipPath id="alertclip"><rect width="720" height="200" rx="3"/></clipPath>
  </defs>

  <g clip-path="url(#alertclip)">
    <rect width="720" height="200" fill="#0e0e16" fill-opacity="0.92"/>
    <rect x="0" y="0" width="6" height="200" fill="#f97316"/>
    <rect x="0" y="156" width="720" height="44" fill="#0a0a10" fill-opacity="0.6"/>
  </g>
  <rect x="0.5" y="0.5" width="719" height="199" rx="3" fill="none" stroke="#2c2c3a" stroke-width="1"/>

  <text x="32" y="72"  font-family="CourbeSans, sans-serif" font-size="44" font-weight="700"
        fill="#f2f2f7">[TITLE]</text>
  <text x="32" y="112" font-family="CourbeSans, sans-serif" font-size="28"
        fill="#8e8e9a">[USERNAME]</text>

  <!-- Mandatory code strip -->
  <text x="32" y="186" font-family="CourbeSans, sans-serif" font-size="16" font-weight="700"
        fill="#8e8e9a" letter-spacing="1.6">CODE</text>
  <text x="110" y="188" font-family="CourbeSans, sans-serif" font-size="40" font-weight="700"
        fill="#f97316" letter-spacing="3.2">[CODE]</text>
  <text x="688" y="186" text-anchor="end" font-family="CourbeSans, sans-serif" font-size="18"
        fill="#8e8e9a">juicer.games</text>
</svg>
